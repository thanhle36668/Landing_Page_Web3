<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="Mạng lưới phi tập trung">
  <defs>
    <radialGradient id="panelBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#141b33"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </radialGradient>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .link { stroke: url(#linkGrad); stroke-width: 2; opacity: 0.55; stroke-dasharray: 6 8; animation: dash 3s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .node { fill: #0b1120; stroke: url(#linkGrad); stroke-width: 2.5; }
    .node-core { fill: #171233; stroke: url(#linkGrad); stroke-width: 3; }
    .pulse { fill: none; stroke: #22d3ee; stroke-width: 1.5; opacity: 0; animation: pulse 3s ease-out infinite; transform-origin: 300px 240px; transform-box: fill-box; }
    .pulse.p2 { animation-delay: 1s; }
    .pulse.p3 { animation-delay: 2s; }
    @keyframes pulse { 0% { opacity: 0.8; transform: scale(0.35); } 100% { opacity: 0; transform: scale(1.6); } }
    .lbl { fill: #c9d2e8; font-family: sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #7c87a3; font-family: sans-serif; font-size: 11.5px; text-anchor: middle; }
    .core-txt { fill: #ffffff; font-family: sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect x="8" y="8" width="584" height="464" rx="28" fill="url(#panelBg)" stroke="rgba(139,92,246,0.35)" stroke-width="1.5"/>
  <circle cx="300" cy="240" r="120" fill="url(#coreGlow)"/>

  <!-- links -->
  <g>
    <line class="link" x1="300" y1="240" x2="140" y2="120"/>
    <line class="link" x1="300" y1="240" x2="460" y2="120"/>
    <line class="link" x1="300" y1="240" x2="110" y2="300"/>
    <line class="link" x1="300" y1="240" x2="490" y2="300"/>
    <line class="link" x1="300" y1="240" x2="200" y2="400"/>
    <line class="link" x1="300" y1="240" x2="410" y2="400"/>
    <line class="link" x1="140" y1="120" x2="460" y2="120"/>
    <line class="link" x1="110" y1="300" x2="490" y2="300"/>
  </g>

  <!-- pulses -->
  <circle class="pulse" cx="300" cy="240" r="52"/>
  <circle class="pulse p2" cx="300" cy="240" r="52"/>
  <circle class="pulse p3" cx="300" cy="240" r="52"/>

  <!-- outer nodes -->
  <g>
    <circle class="node" cx="140" cy="120" r="26"/><text class="lbl" x="140" y="168">DeFi</text>
    <circle class="node" cx="460" cy="120" r="26"/><text class="lbl" x="460" y="168">NFT</text>
    <circle class="node" cx="110" cy="300" r="26"/><text class="lbl" x="110" y="348">DAO</text>
    <circle class="node" cx="490" cy="300" r="26"/><text class="lbl" x="490" y="348">DApps</text>
    <circle class="node" cx="200" cy="400" r="26"/><text class="lbl" x="200" y="448">Ví số</text>
    <circle class="node" cx="410" cy="400" r="26"/><text class="lbl" x="410" y="448">Chuỗi khối</text>
  </g>

  <!-- core node -->
  <circle class="node-core" cx="300" cy="240" r="52"/>
  <text class="core-txt" x="300" y="249">Bạn</text>
  <text class="sub" x="300" y="318">Không máy chủ trung tâm</text>
</svg>
